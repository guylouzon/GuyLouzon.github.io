<html>
	<head>
		<!-- Load branches.js from CDN (remove duplicate local includes) -->
		<script type="text/javascript" src="branches.js"></script>
		<link rel="stylesheet" href="bootstrap.min.css">
		<meta name="description" content="branches.js" />
		<meta name="keywords" content="a script to plant and update variables inside an html" />
	
		<!-- Twitter Card data -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:site" content="Guy Louzon" />
		<meta name="twitter:title" content="branches.js" />
		<meta name="twitter:url" content="https://guylouzon.github.io/branches/"  />
		<meta name="twitter:description" content="a script to plant and update variables inside an html" />
		<meta name="twitter:creator" content="@guylouzon" />
		<meta name="twitter:image" content="https://guylouzon.github.io/branches/bae.jpg" />
	
		<!-- Open Graph data -->
		<meta property="og:title" content="branches.js" />
		<meta property="og:type" content="article" />
		<meta property="og:url" content="https://guylouzon.github.io/branches/" />
		<meta property="og:image" content="https://guylouzon.github.io/branches/bae.jpg" />
		<meta property="og:description" content="a script to plant and update variables inside an html" /> 
	</head>
	<body>
	
	<nav class="navbar navbar-expand navbar-dark bg-info">
		<a class="navbar-brand" href="#">BAE</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExample02" aria-controls="navbarsExample02" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
	
		<div class="collapse navbar-collapse" id="navbarsExample02">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item active">
					<!-- Notice we use lower-case onClick (or better, use addEventListener) -->
					<a class="nav-link" href="#">Google <span class="sr-only">(current)</span></a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="branch0.climbABranch(app2);">Yandex</a>
				</li>
			</ul>
			<form class="form-inline my-2 my-md-0 branches" action="{$action}" method="GET">
				<input class="form-control branches" type="text" name="{$iname}" placeholder="search">
			</form>
		</div>
	</nav>
	
	<div class="card border-light mb-3 mx-auto" style="width: 100%; max-width: 394px;">
		<div class="card-header branches">
			<a href="https://github.com/GuyLou/branches.js">branches.js</a> {$langpresents}:
		</div>
		<img class="rounded mx-auto d-block" src="bae.jpg" style="width: 100%; max-width: 394px;">
	</div>
	
	<div class="card mb-3 mx-auto" style="width: 100%; max-width: 394px; border: none;">
		<span class="branches">{$langselect}
			<button type="button" class="btn btn-primary btn-xs langsel" id="en">en</button>
			<button type="button" class="btn btn-info btn-xs langsel" id="es">es</button>
		</span>
	</div>
	
	<div class="card border-info mb-3 mx-auto" style="width: 100%; max-width: 394px;">
		<div class="card-header"><a href="https://github.com/GuyLou/branches.js" class="branches">{$langheader}</a></div>
		<div class="card-body text-info">
			<h5 class="card-title branches">{$langtitle}</h5>
			<p class="card-text branches">{$langdescription}</p>
		</div>
	</div>
	
	<div class="card border-info mb-3 mx-auto" style="width: 100%; max-width: 394px;">
		<div class="card-header text-center branches">
			{$langexample}: 
			<button type="button" class="btn btn-danger go" id="31">31</button>
			<button type="button" class="btn btn-warning go" id="41">41</button>
			<button type="button" class="btn btn-success go" id="59">59</button>
		</div>
		<div class="card-body text-info">
			<span class="card-text branches">{$langtask}: </span><h5 class="card-title branches">{$title}</h5>
			<span class="card-text branches">{$languser}: </span><span class="card-text branches">{$userId}</span><br />
			<span class="card-text branches">{$langid}: </span><span class="card-text branches">{$id}</span><br />
			<span class="card-text branches">{$langstatus}: </span><span class="card-text branches">{$completed}</span><br />
		</div>
	</div>
	
	<script type="text/javascript">
		(function(){
			// Initialize branches library
			var branch0 = new branches();
	
			// Language objects
			var en = {
				"langselect": "language",
				"langheader": "branches.js",
				"langexample": "An external JSON example",
				"langpresents": "presents",
				"langtask": "task",
				"langstatus": "is completed",
				"langid": "id",
				"languser": "user id",
				"langtitle": "a script to plant and update variables inside an html",
				"langdescription": "build template as html based apps!<br />update the template headers - change the language<br />Change the page content without reloading the page<br /><br />plant variables inside the page<br />load the values using ajax or preset jsons"
			};
			var es = {
				"langselect": "idioma",
				"langheader": "branches.js",
				"langexample": "Un ejemplo externo de JSON",
				"langpresents": "presenta",
				"langtask": "task",
				"langstatus": "está completo",
				"langid": "id",
				"languser": "usuario",
				"langtitle": "a script to plant and update variables inside an html",
				"langdescription": "build template as html based apps!<br />update the template headers - change the language<br />Change the page content without reloading the page<br /><br />plant variables inside the page<br />load the values using ajax or preset jsons",
				"helloworld": "Hola Mundo !"
			};
	
			// App configurations for the search form
			var app1 = {"action":"https://www.google.com/search","placeholder":"google","iname":"q"};
			var app2 = {"action":"https://www.yandex.ru/search/","placeholder":"Яндекс","iname":"text"};
	
			// Attach event listeners for language buttons
			var langButtons = document.getElementsByClassName('langsel');
			for (let i = 0; i < langButtons.length; i++) {
				langButtons[i].onclick = function() {
					branch0.climbABranch(this.id === "en" ? 'en' : 'es');
				};
			}
			// for (let i = 0; i < langButtons.length; i++) {
			// 	(function(j){
			// 		langButtons[j].addEventListener('click', function() {
			// 			// Call climbABranch with the appropriate language object
			// 			if (this.id === "en") {
			// 				branch0.climbABranch(en);
			// 			} else if (this.id === "es") {
			// 				branch0.climbABranch(es);
			// 			}
			// 		});
			// 	})(i);
			// }
			
			// Attach event listeners for "go" buttons to fetch JSON data and update page
			var goButtons = document.getElementsByClassName('go');
			for (i = 0; i < goButtons.length; i++) {
				(function(j){
					goButtons[j].addEventListener('click', function() {
						fetch('https://jsonplaceholder.typicode.com/todos/' + goButtons[j].id)
							.then(response => response.json())
							.then(json => branch0.climbABranch(json))
							.catch(error => console.error('Error:', error));
					}, false);
				})(i);
			}
			
			// Optionally, set a default language or configuration on load:
			branch0.climbABranch(en);
			branch0.climbABranch(app1);
		})();
	</script>
	
	</body>
	</html>
