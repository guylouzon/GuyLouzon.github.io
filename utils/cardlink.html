<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .card-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .card-image {
            width: 100%;
            height: 75vh;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }
        
        .card-info {
            padding: 20px;
        }
        
        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .title {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }
        
        .contact-info {
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .share-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        
        .share-bar a {
            color: #444;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        
        .share-bar a:hover {
            transform: scale(1.1);
            color: #007bff;
        }
        
        .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>
    <div class="card-container">
        <img src="/api/placeholder/400/320" alt="Profile Picture" class="card-image" id="profile-image">
        
        <div class="card-info">
            <div class="name" id="contact-name">John Doe</div>
            <div class="title" id="contact-title">Software Engineer</div>
            <div class="contact-info" id="contact-email">email@example.com</div>
            <div class="contact-info" id="contact-phone">(123) 456-7890</div>
        </div>
        
        <div class="share-bar" id="social-bar">
            <a href="#" id="linkedin-link" target="_blank">
                <i class="fab fa-linkedin icon"></i>
                <span>LinkedIn</span>
            </a>
            <a href="#" id="twitter-link" target="_blank">
                <i class="fab fa-twitter icon"></i>
                <span>Twitter</span>
            </a>
            <a href="#" id="github-link" target="_blank">
                <i class="fab fa-github icon"></i>
                <span>GitHub</span>
            </a>
            <a href="#" id="instagram-link" target="_blank">
                <i class="fab fa-instagram icon"></i>
                <span>Instagram</span>
            </a>
        </div>
    </div>

    <script>
        // Default contact data that will be used as fallback
        const defaultContactData = {
            name: "John Doe",
            title: "Software Engineer",
            email: "john.doe@example.com",
            phone: "(123) 456-7890",
            image: "/api/placeholder/400/320",
            social: {
                linkedin: "https://linkedin.com/in/johndoe",
                twitter: "https://twitter.com/johndoe",
                github: "https://github.com/johndoe",
                instagram: "https://instagram.com/johndoe"
            }
        };

        // Function to parse URL query parameters
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            // Get basic contact info
            params.name = urlParams.get('name');
            params.title = urlParams.get('title');
            params.email = urlParams.get('email');
            params.phone = urlParams.get('phone');
            params.image = urlParams.get('image');
            
            // Get social links
            params.social = {
                linkedin: urlParams.get('linkedin'),
                twitter: urlParams.get('twitter'),
                github: urlParams.get('github'),
                instagram: urlParams.get('instagram')
            };
            
            return params;
        }

        // Merge URL parameters with default data
        function mergeContactData() {
            const urlParams = getQueryParams();
            const contactData = {...defaultContactData};
            
            // Update basic info if provided in URL
            if (urlParams.name) contactData.name = urlParams.name;
            if (urlParams.title) contactData.title = urlParams.title;
            if (urlParams.email) contactData.email = urlParams.email;
            if (urlParams.phone) contactData.phone = urlParams.phone;
            if (urlParams.image) contactData.image = urlParams.image;
            
            // Update social links if provided in URL
            if (urlParams.social.linkedin) contactData.social.linkedin = urlParams.social.linkedin;
            if (urlParams.social.twitter) contactData.social.twitter = urlParams.social.twitter;
            if (urlParams.social.github) contactData.social.github = urlParams.social.github;
            if (urlParams.social.instagram) contactData.social.instagram = urlParams.social.instagram;
            
            return contactData;
        }

        // Function to load contact data
        function loadContactData() {
            const contactData = mergeContactData();
            
            document.getElementById("contact-name").textContent = contactData.name;
            document.getElementById("contact-title").textContent = contactData.title;
            document.getElementById("contact-email").textContent = contactData.email;
            document.getElementById("contact-phone").textContent = contactData.phone;
            document.getElementById("profile-image").src = contactData.image;
            
            document.getElementById("linkedin-link").href = contactData.social.linkedin;
            document.getElementById("twitter-link").href = contactData.social.twitter;
            document.getElementById("github-link").href = contactData.social.github;
            document.getElementById("instagram-link").href = contactData.social.instagram;
            
            // Set page title to the contact's name
            document.title = contactData.name + " - Digital Business Card";
        }

        // Initialize the app
        window.onload = function() {
            loadContactData();
        };
    </script>
</body>
</html>
