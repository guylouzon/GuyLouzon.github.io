<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .phone-container {
            display: flex;
            gap: 10px;
        }

        .country-code {
            flex: 0 0 100px;
        }

        .phone-number {
            flex: 1;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .qr-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .popup-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .qr-item {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9ff;
            transition: transform 0.3s ease;
        }

        .qr-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .qr-item h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1rem;
        }

        .qr-code {
            margin: 15px auto;
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(-30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .qr-grid {
                grid-template-columns: 1fr;
            }
            
            .popup-content {
                padding: 30px 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact QR Generator</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>Phone</label>
                <div class="phone-container">
                    <input type="text" id="countryCode" name="countryCode" placeholder="+1" class="country-code" required>
                    <input type="tel" id="phone" name="phone" placeholder="Phone number" class="phone-number" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="linkedin">LinkedIn</label>
                <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username" required>
            </div>
            
            <button type="submit" class="generate-btn">
                <svg class="qr-icon" viewBox="0 0 24 24">
                    <path d="M3,11H5V13H3V11M11,5H13V9H11V5M9,11H13V15H9V11M15,11H17V13H15V11M19,11H21V13H19V11M21,9H15V15H21V9M21,19H15V21H21V19M3,5H9V11H3V5M5,7V9H7V7H5M3,19H9V21H3V19M5,19V21H7V19H5M19,5H21V9H19V5Z"/>
                </svg>
                Generate QR Codes
            </button>
        </form>
    </div>

    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Your Contact QR Codes</h2>
            <div class="qr-grid" id="qrGrid">
                <!-- QR codes will be generated here -->
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const popup = document.getElementById('popupOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const qrGrid = document.getElementById('qrGrid');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate form
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            if (!data.name || !data.email || !data.countryCode || !data.phone || !data.linkedin) {
                alert('Please fill in all fields');
                return;
            }
            
            generateQRCodes();
        });

        closeBtn.addEventListener('click', closePopup);
        popup.addEventListener('click', function(e) {
            if (e.target === popup) {
                closePopup();
            }
        });

        function generateQRCodes() {
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            console.log('Form data:', data); // Debug log
            
            // Format phone number - remove any spaces and ensure proper format
            const cleanCountryCode = data.countryCode.trim();
            const cleanPhone = data.phone.trim().replace(/\s+/g, '');
            const fullPhone = cleanCountryCode + cleanPhone;
            
            console.log('Full phone:', fullPhone); // Debug log
            
            // Create QR code data
            const qrData = [
                {
                    title: 'Email',
                    data: `mailto:${data.email}?subject=Hello ${data.name}`,
                    color: '#4285f4'
                },
                {
                    title: 'Phone Call',
                    data: `tel:${fullPhone}`,
                    color: '#34a853'
                },
                {
                    title: 'WhatsApp',
                    data: `https://wa.me/${fullPhone.replace('+', '')}`,
                    color: '#25d366'
                },
                {
                    title: 'LinkedIn',
                    data: data.linkedin,
                    color: '#0077b5'
                }
            ];

            console.log('QR Data:', qrData); // Debug log

            // Clear previous QR codes
            qrGrid.innerHTML = '';

            // Generate QR codes with error handling
            qrData.forEach((item, index) => {
                try {
                    const qrItem = document.createElement('div');
                    qrItem.className = 'qr-item';
                    qrItem.style.borderTop = `4px solid ${item.color}`;
                    
                    const title = document.createElement('h3');
                    title.textContent = item.title;
                    title.style.color = item.color;
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'qr-code';
                    
                    // Generate QR code with error handling
                    try {
                        const qr = new QRious({
                            element: canvas,
                            value: item.data,
                            size: 150,
                            foreground: item.color,
                            background: 'white',
                            level: 'M'
                        });
                        console.log(`QR code generated for ${item.title}:`, item.data); // Debug log
                    } catch (qrError) {
                        console.error(`Error generating QR for ${item.title}:`, qrError);
                        // Create fallback text
                        const errorText = document.createElement('p');
                        errorText.textContent = 'QR generation failed';
                        errorText.style.color = '#ff0000';
                        qrItem.appendChild(errorText);
                    }
                    
                    qrItem.appendChild(title);
                    qrItem.appendChild(canvas);
                    qrGrid.appendChild(qrItem);
                } catch (error) {
                    console.error(`Error creating QR item for ${item.title}:`, error);
                }
            });

            console.log('Showing popup...'); // Debug log
            // Show popup
            popup.classList.add('show');
            popup.style.display = 'flex'; // Force display
        }

        function closePopup() {
            popup.classList.remove('show');
            popup.style.display = 'none';
        }

        // Close popup with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && popup.classList.contains('show')) {
                closePopup();
            }
        });
    </script>
</body>
</html>
