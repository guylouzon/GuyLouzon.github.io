<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    
    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide-react@0.263.0/dist/umd/lucide-react.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure Lucide icons
        const { Gamepad2, Puzzle, Target, Rocket } = lucideReact;

        // Game card component
        const GameCard = ({ icon: Icon, title, description, color }) => {
            return (
                <div className="bg-white shadow-lg rounded-xl p-6 transform transition-all duration-300 hover:scale-105 hover:shadow-xl">
                    <div className={`mb-4 w-16 h-16 ${color} rounded-full flex items-center justify-center`}>
                        <Icon className="w-8 h-8 text-white" />
                    </div>
                    <h3 className="text-xl font-bold mb-2 text-gray-800">{title}</h3>
                    <p className="text-gray-600 mb-4">{description}</p>
                    <button className="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors">
                        Play Now
                    </button>
                </div>
            );
        };

        // Main Landing Page Component
        const GameLandingPage = () => {
            const games = [
                {
                    icon: Gamepad2,
                    title: "Arcade Classics",
                    description: "Retro-inspired arcade games that will test your skills and reflexes.",
                    color: "bg-red-500"
                },
                {
                    icon: Puzzle,
                    title: "Brain Teasers",
                    description: "Challenge your mind with intricate puzzles and logic games.",
                    color: "bg-green-500"
                },
                {
                    icon: Target,
                    title: "Strategy Challenge",
                    description: "Engage in strategic gameplay that requires careful planning.",
                    color: "bg-purple-500"
                },
                {
                    icon: Rocket,
                    title: "Adventure Quest",
                    description: "Embark on epic journeys and explore immersive game worlds.",
                    color: "bg-orange-500"
                }
            ];

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="bg-blue-600 text-white py-16 text-center">
                        <h1 className="text-4xl font-bold mb-4">Game Hub</h1>
                        <p className="text-xl max-w-2xl mx-auto">
                            Discover a world of exciting games, from brain-teasing puzzles to epic adventures.
                        </p>
                    </header>

                    {/* Game Cards Section */}
                    <main className="container mx-auto px-4 py-12">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {games.map((game, index) => (
                                <GameCard 
                                    key={index}
                                    icon={game.icon}
                                    title={game.title}
                                    description={game.description}
                                    color={game.color}
                                />
                            ))}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-gray-800 text-white py-6 text-center">
                        <p>&copy; 2024 Game Hub. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<GameLandingPage />, document.getElementById('root'));
    </script>
</body>
</html>
