<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Image Puzzle</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
        }
        #puzzle-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            position: relative;
            margin-top: 20px;
            border: 3px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-color: #ddd;
            overflow: hidden;
        }
        .puzzle-piece {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
            cursor: move;
            transition: transform 0.2s, box-shadow 0.2s;
            background-size: cover;
        }
        .puzzle-piece:hover {
            transform: scale(1.02);
            z-index: 100;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
        }
        .puzzle-piece.correct {
            border: 1px solid rgba(0,255,0,0.5);
            box-shadow: 0 0 8px rgba(0,255,0,0.4);
        }
        #controls {
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #3b78e7;
        }
        select, input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        #difficulty {
            min-width: 100px;
        }
        #custom-url-input {
            flex-grow: 1;
            min-width: 150px;
        }
        #message {
            margin: 15px 0;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 24px;
            font-weight: bold;
        }
        .completed-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .completed-overlay button {
            margin-top: 20px;
        }
        .url-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            gap: 10px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            text-align: center;
        }
        
        /* Media queries for better mobile responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            #controls {
                flex-direction: column;
                align-items: center;
            }
            select, button, input {
                width: 100%;
            }
            .url-container {
                flex-direction: column;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>Enhanced Image Puzzle</h1>
    
    <div id="controls">
        <select id="difficulty">
            <option value="3">Easy (3×3)</option>
            <option value="4">Medium (4×4)</option>
            <option value="5">Hard (5×5)</option>
            <option value="6">Expert (6×6)</option>
        </select>
        <button id="default-image-btn">Default Image</button>
        <button id="random-image-btn">Random Image</button>
        <button id="shuffle-btn">Shuffle</button>
        <button id="solve-btn">Solve</button>
    </div>
    
    <div class="url-container">
        <input type="text" id="custom-url-input" placeholder="Enter custom image URL...">
        <button id="custom-image-btn">Use This Image</button>
    </div>
    
    <div id="message"></div>
    
    <div id="puzzle-container">
        <div class="loading">Loading image...</div>
        <div class="completed-overlay">
            <p>Puzzle Completed! 🎉</p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>
    
    <script>
        // Configuration
        let ROWS = 3;
        let COLS = 3;
        let PUZZLE_WIDTH = 500;
        let PUZZLE_HEIGHT = 500;
        
        // State
        let pieces = [];
        let correctPositions = 0;
        let imageLoaded = false;
        let puzzleContainer = document.getElementById('puzzle-container');
        let completedOverlay = document.querySelector('.completed-overlay');
        let messageElement = document.getElementById('message');
        let currentImageUrl = '';
        let defaultImageUrl = 'dalle_unicorn.webp'; // Default local image
        
        // Sound effects
        function playClickSound() {
            showMessage("🔊 Click!", "info");
        }
        
        function playSuccessSound() {
            showMessage("🎵 Success!", "success");
        }
        
        function playWinSound() {
            showMessage("🎺 Congratulations!", "success");
        }
        
        // Show message with animation
        function showMessage(text, type) {
            messageElement.textContent = text;
            messageElement.className = type;
            messageElement.style.opacity = 1;
            
            setTimeout(() => {
                messageElement.style.opacity = 0;
            }, 2000);
        }
        
        // Get random image
        function getRandomImage() {
            const width = Math.floor(PUZZLE_WIDTH);
            const height = Math.floor(PUZZLE_HEIGHT);
            return `https://picsum.photos/${width}/${height}`;
        }
        
        // Update puzzle container size based on viewport
        function updatePuzzleSize() {
            const containerWidth = puzzleContainer.offsetWidth;
            PUZZLE_WIDTH = containerWidth;
            PUZZLE_HEIGHT = containerWidth; // Keep it square
            
            // If we already have pieces, we need to resize them
            if (pieces.length > 0 && imageLoaded) {
                resizePieces();
            }
        }
        
        // Resize pieces when window size changes
        function resizePieces() {
            const pieceWidth = PUZZLE_WIDTH / COLS;
            const pieceHeight = PUZZLE_HEIGHT / ROWS;
            
            pieces.forEach(piece => {
                const row = parseInt(piece.dataset.row);
                const col = parseInt(piece.dataset.col);
                
                // Update piece size
                piece.style.width = pieceWidth + 'px';
                piece.style.height = pieceHeight + 'px';
                
                // Update background size
                piece.style.backgroundSize = `${PUZZLE_WIDTH}px ${PUZZLE_HEIGHT}px`;
                
                // Update background position
                piece.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;
                
                // Update correct position data
                piece.dataset.correctX = col * pieceWidth + 'px';
                piece.dataset.correctY = row * pieceHeight + 'px';
                
                // If piece is in correct position, update its position
                if (piece.classList.contains('correct')) {
                    piece.style.left = col * pieceWidth + 'px';
                    piece.style.top = row * pieceHeight + 'px';
                }
            });
        }
        
        // Load image and set up puzzle
        function loadImage(imageUrl = 'dalle_unicorn.webp') {
            // Clear existing puzzle
            clearPuzzle();
            
            // Show loading
            document.querySelector('.loading').style.display = 'flex';
            
            // Store current image URL
            currentImageUrl = imageUrl;
            
            // Create image element to check when it's loaded
            const img = new Image();
            img.onload = function() {
                document.querySelector('.loading').style.display = 'none';
                imageLoaded = true;
                initPuzzle();
                shufflePieces();
                showMessage("New puzzle ready!", "success");
            };
            img.onerror = function() {
                document.querySelector('.loading').style.display = 'none';
                showMessage("Error loading image. Please try another URL.", "error");
                // If default image fails, try a placeholder
                if (imageUrl === defaultImageUrl) {
                    setTimeout(() => loadImage(getRandomImage()), 1000);
                }
            };
            img.src = imageUrl;
        }
        
        // Initialize puzzle
        function initPuzzle() {
            // Get difficulty settings
            const difficultySelect = document.getElementById('difficulty');
            ROWS = parseInt(difficultySelect.value);
            COLS = parseInt(difficultySelect.value);
            
            // Update puzzle size
            updatePuzzleSize();
            
            // Piece dimensions
            const pieceWidth = PUZZLE_WIDTH / COLS;
            const pieceHeight = PUZZLE_HEIGHT / ROWS;
            
            // Reset correctPositions count
            correctPositions = 0;
            
            // Create puzzle pieces
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.style.width = pieceWidth + 'px';
                    piece.style.height = pieceHeight + 'px';
                    
                    // Store original correct position
                    piece.dataset.row = row;
                    piece.dataset.col = col;
                    piece.dataset.correctX = col * pieceWidth + 'px';
                    piece.dataset.correctY = row * pieceHeight + 'px';
                    
                    // Set background image to show only a slice of the image
                    piece.style.backgroundImage = `url(${currentImageUrl})`;
                    piece.style.backgroundSize = `${PUZZLE_WIDTH}px ${PUZZLE_HEIGHT}px`;
                    piece.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;
                    
                    // Position in the correct place initially
                    piece.style.left = (col * pieceWidth) + 'px';
                    piece.style.top = (row * pieceHeight) + 'px';
                    
                    // Make draggable
                    makeDraggable(piece);
                    
                    // Add to container and track
                    puzzleContainer.appendChild(piece);
                    pieces.push(piece);
                }
            }
        }
        
        // Make an element draggable with snap-to-grid
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let isDragging = false;
            let startX, startY;
            
            element.addEventListener('mousedown', dragMouseDown);
            element.addEventListener('touchstart', dragTouchStart, { passive: false });
            
            function dragTouchStart(e) {
                e.preventDefault(); // Prevent scrolling while dragging
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                dragStart(touch.clientX, touch.clientY);
                
                document.addEventListener('touchend', closeDragElement, { once: true });
                document.addEventListener('touchcancel', closeDragElement, { once: true });
                document.addEventListener('touchmove', elementTouchDrag, { passive: false });
            }
            
            function elementTouchDrag(e) {
                e.preventDefault();
                const touch = e.touches[0];
                elementDragMove(touch.clientX, touch.clientY);
            }
            
            function dragMouseDown(e) {
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                dragStart(e.clientX, e.clientY);
                
                document.addEventListener('mouseup', closeDragElement, { once: true });
                document.addEventListener('mousemove', elementDrag);
            }
            
            function dragStart(clientX, clientY) {
                playClickSound();
                
                // Remove the correct class if it exists
                element.classList.remove('correct');
                
                // Get mouse position at start
                pos3 = clientX;
                pos4 = clientY;
                
                // Bring to front
                element.style.zIndex = "10";
                
                // Scale up slightly
                element.style.transform = "scale(1.05)";
                
                isDragging = true;
            }
            
            function elementDrag(e) {
                e.preventDefault();
                elementDragMove(e.clientX, e.clientY);
            }
            
            function elementDragMove(clientX, clientY) {
                if (!isDragging) return;
                
                // Calculate new position
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                
                // Get current piece dimensions
                const pieceWidth = parseFloat(element.style.width);
                const pieceHeight = parseFloat(element.style.height);
                
                // Set new position
                const newTop = element.offsetTop - pos2;
                const newLeft = element.offsetLeft - pos1;
                
                // Constrain to puzzle boundaries
                const boundedTop = Math.max(0, Math.min(newTop, PUZZLE_HEIGHT - pieceHeight));
                const boundedLeft = Math.max(0, Math.min(newLeft, PUZZLE_WIDTH - pieceWidth));
                
                element.style.top = boundedTop + "px";
                element.style.left = boundedLeft + "px";
            }
            
            function closeDragElement(e) {
                // Check if it was just a tap/click (no dragging)
                const isJustClick = e.type === 'mouseup' && 
                                   Math.abs(e.clientX - startX) < 5 && 
                                   Math.abs(e.clientY - startY) < 5;
                
                if (!isDragging || isJustClick) {
                    // Reset z-index and transform without snapping for clicks
                    element.style.zIndex = "1";
                    element.style.transform = "scale(1)";
                    isDragging = false;
                    return;
                }
                
                // Stop moving when mouse/touch is released
                document.removeEventListener('mousemove', elementDrag);
                document.removeEventListener('touchmove', elementTouchDrag);
                
                // Reset transformation
                element.style.transform = "scale(1)";
                
                // Snap to grid
                snapToGrid(element);
                
                setTimeout(() => {
                    // Reset z-index
                    element.style.zIndex = "1";
                    isDragging = false;
                    
                    // Check if puzzle is complete
                    checkPuzzleComplete();
                }, 200);
            }
        }
        
        // Snap piece to nearest grid position
        function snapToGrid(piece) {
            // Get current piece dimensions
            const pieceWidth = parseFloat(piece.style.width);
            const pieceHeight = parseFloat(piece.style.height);
            
            // Current position
            const currentLeft = parseFloat(piece.style.left);
            const currentTop = parseFloat(piece.style.top);
            
            // Find nearest grid position
            const gridX = Math.round(currentLeft / pieceWidth) * pieceWidth;
            const gridY = Math.round(currentTop / pieceHeight) * pieceHeight;
            
            // Animate to snap position
            piece.style.transition = "left 0.2s, top 0.2s";
            piece.style.left = gridX + "px";
            piece.style.top = gridY + "px";
            
            // Check if piece is in correct position
            const correctX = parseFloat(piece.dataset.correctX);
            const correctY = parseFloat(piece.dataset.correctY);
            
            // Allow a small margin of error due to floating point
            const isCorrectX = Math.abs(gridX - correctX) < 2;
            const isCorrectY = Math.abs(gridY - correctY) < 2;
            
            if (isCorrectX && isCorrectY) {
                // Ensure perfect alignment
                piece.style.left = piece.dataset.correctX;
                piece.style.top = piece.dataset.correctY;
                piece.classList.add('correct');
                playSuccessSound();
            }
            
            // Reset transition after snap animation
            setTimeout(() => {
                piece.style.transition = "transform 0.2s, box-shadow 0.2s";
            }, 200);
        }
        
        // Shuffle pieces randomly across the container
        function shufflePieces() {
            completedOverlay.style.opacity = 0;
            completedOverlay.style.pointerEvents = 'none';
            
            // Remove all 'correct' classes
            pieces.forEach(piece => {
                piece.classList.remove('correct');
            });
            
            correctPositions = 0;
            
            const pieceWidth = PUZZLE_WIDTH / COLS;
            const pieceHeight = PUZZLE_HEIGHT / ROWS;
            
            pieces.forEach(piece => {
                const randomX = Math.floor(Math.random() * (PUZZLE_WIDTH - pieceWidth));
                const randomY = Math.floor(Math.random() * (PUZZLE_HEIGHT - pieceHeight));
                
                // Snap to grid for a cleaner look
                const gridX = Math.round(randomX / pieceWidth) * pieceWidth;
                const gridY = Math.round(randomY / pieceHeight) * pieceHeight;
                
                piece.style.transition = "left 0.4s, top 0.4s, transform 0.4s";
                piece.style.left = gridX + 'px';
                piece.style.top = gridY + 'px';
                
                // Random slight rotation for extra challenge
                const randomRotation = Math.floor(Math.random() * 20) - 10;
                piece.style.transform = `rotate(${randomRotation}deg)`;
                
                // Reset transition after shuffle animation
                setTimeout(() => {
                    piece.style.transition = "transform 0.2s, box-shadow 0.2s";
                }, 400);
            });
            
            showMessage("Puzzle shuffled! Start solving!", "info");
        }
        
        // Solve the puzzle by putting pieces back in correct order
        function solvePuzzle() {
            pieces.forEach(piece => {
                const row = parseInt(piece.dataset.row);
                const col = parseInt(piece.dataset.col);
                const pieceWidth = PUZZLE_WIDTH / COLS;
                const pieceHeight = PUZZLE_HEIGHT / ROWS;
                
                // Animate back to original position
                piece.style.transition = "all 0.8s ease-in-out";
                piece.style.left = (col * pieceWidth) + 'px';
                piece.style.top = (row * pieceHeight) + 'px';
                piece.style.transform = 'rotate(0deg)';
                piece.classList.add('correct');
                
                // Reset transition after animation
                setTimeout(() => {
                    piece.style.transition = "transform 0.2s, box-shadow 0.2s";
                }, 800);
            });
            
            // Show completed message after animation finishes
            setTimeout(() => {
                showPuzzleCompleted();
            }, 1000);
        }
        
        // Check if all pieces are in correct positions
        function checkPuzzleComplete() {
            correctPositions = 0;
            
            pieces.forEach(piece => {
                if (piece.classList.contains('correct')) {
                    correctPositions++;
                }
            });
            
            // If all pieces are correct, show completion
            if (correctPositions === pieces.length) {
                showPuzzleCompleted();
            }
        }
        
        // Show puzzle completed overlay and effects
        function showPuzzleCompleted() {
            playWinSound();
            
            // Make all pieces flat with no rotation
            pieces.forEach(piece => {
                piece.style.transform = 'rotate(0deg)';
                piece.classList.add('correct');
            });
            
            // Show completion overlay
            completedOverlay.style.opacity = 1;
            completedOverlay.style.pointerEvents = 'auto';
        }
        
        // Clear all puzzle pieces
        function clearPuzzle() {
            while (puzzleContainer.querySelector('.puzzle-piece')) {
                puzzleContainer.removeChild(puzzleContainer.querySelector('.puzzle-piece'));
            }
            pieces = [];
            correctPositions = 0;
        }
        
        // Load custom image from URL
        function loadCustomImage() {
            const urlInput = document.getElementById('custom-url-input');
            const url = urlInput.value.trim();
            
            if (!url) {
                showMessage("Please enter a valid image URL", "error");
                return;
            }
            
            loadImage(url);
        }
        
        // Event listeners
        document.getElementById('default-image-btn').addEventListener('click', () => loadImage(defaultImageUrl));
        document.getElementById('random-image-btn').addEventListener('click', () => loadImage(getRandomImage()));
        document.getElementById('custom-image-btn').addEventListener('click', loadCustomImage);
        document.getElementById('shuffle-btn').addEventListener('click', shufflePieces);
        document.getElementById('solve-btn').addEventListener('click', solvePuzzle);
        document.getElementById('play-again-btn').addEventListener('click', shufflePieces);
        document.getElementById('difficulty').addEventListener('change', () => {
            if (imageLoaded) {
                clearPuzzle();
                initPuzzle();
                shufflePieces();
            }
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            updatePuzzleSize();
        });
        
        // Initialize when page loads
        window.onload = function() {
            updatePuzzleSize();
            loadImage(defaultImageUrl);
        };
    </script>
</body>
</html>
