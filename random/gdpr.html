<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDPR Message Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .controls {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #e9ecef;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
        }

        select, input[type="color"], input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        select:focus, input[type="color"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="url"].invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
        }

        .url-error {
            color: #dc3545;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }

        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        .preview-section {
            background: white;
            border-radius: 15px;
            border: 1px solid #e9ecef;
            overflow: hidden;
        }

        .preview-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-content {
            padding: 30px;
            height: 400px;
            overflow-y: auto;
        }

        .gdpr-message {
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        .preview-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .preview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: white;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001;
        }

        .popup.active {
            bottom: 0;
        }

        .popup-content {
            padding: 10px;
            max-height: 70vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.1);
            border: none;
            color: #666;
            font-size: 1.2em;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.2);
            color: #333;
        }

        .copy-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9em;
            position: absolute;
            bottom: 10px;
            right: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(40, 167, 69, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .popup-content .cookie-banner {
            width: 100%;
            margin: 0;
            border: none;
            box-shadow: none;
            padding-bottom: 60px; /* Space for copy button */
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #17a2b8, #138496);
        }

        .cookie-banner {
            background: white;
            border-radius: 10px;
            border: 2px solid #e9ecef;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .cookie-banner h4 {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .cookie-banner p {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .cookie-banner a {
            color: #667eea;
            text-decoration: underline;
        }

        .cookie-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .cookie-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            flex: 1;
            min-width: 120px;
        }

        .cookie-btn.accept {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            box-shadow: 0 2px 10px rgba(40, 167, 69, 0.3);
        }

        .cookie-btn.accept:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .cookie-btn.mandatory {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #212529;
            box-shadow: 0 2px 10px rgba(255, 193, 7, 0.3);
        }

        .cookie-btn.mandatory:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        .cookie-btn.reject {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            box-shadow: 0 2px 10px rgba(108, 117, 125, 0.3);
        }

        .cookie-btn.reject:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
        }

        @media (max-width: 480px) {
            .cookie-buttons {
                flex-direction: column;
            }
            
            .cookie-btn {
                flex: none;
            }
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .popup {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GDPR Message Generator</h1>
            <p>Create customized GDPR compliance messages for your website</p>
        </div>
        
        <div class="content">
            <div class="controls">
                <div class="control-group">
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="font">Font Family</label>
                    <select id="font">
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Helvetica Neue', sans-serif">Helvetica Neue</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Open Sans', sans-serif">Open Sans</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="textColor">Text Color</label>
                    <input type="color" id="textColor" value="#2c3e50">
                </div>
                
                <div class="control-group">
                    <label for="bgColor">Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                
                <div class="control-group">
                    <label for="privacyUrl">Privacy Policy URL</label>
                    <input type="url" id="privacyUrl" placeholder="https://example.com/privacy" value="https://example.com/privacy-policy">
                    <div class="url-error" id="urlError">Please enter a valid URL (e.g., https://example.com/privacy)</div>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="preview-header">
                    <span>Live Preview</span>
                    <button class="preview-btn" onclick="showPopup()">
                        Full Preview
                    </button>
                </div>
                <div class="preview-content">
                    <div class="gdpr-message" id="preview"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="popup-overlay" id="popupOverlay" onclick="hidePopup()">
        <div class="popup" id="popup" onclick="event.stopPropagation()">
            <div class="popup-content">
                <button class="close-btn" onclick="hidePopup()">&times;</button>
                <div class="gdpr-message" id="popupPreview"></div>
                <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">
                    Copy HTML
                </button>
            </div>
        </div>
    </div>

    <script>
        const messages = {
            en: {
                title: "We use cookies",
                text: "We use cookies and similar technologies to enhance your experience and analyze site usage. Some are essential for functionality.",
                privacy: "Read our <a href='{url}' target='_blank'>Privacy Policy</a>",
                buttons: {
                    accept: "Accept All",
                    mandatory: "Accept Mandatory",
                    reject: "Reject All"
                }
            },
            es: {
                title: "Usamos cookies",
                text: "Utilizamos cookies y tecnologías similares para mejorar tu experiencia y analizar el uso del sitio. Algunas son esenciales para la funcionalidad.",
                privacy: "Lee nuestra <a href='{url}' target='_blank'>Política de Privacidad</a>",
                buttons: {
                    accept: "Aceptar Todo",
                    mandatory: "Aceptar Obligatorias",
                    reject: "Rechazar Todo"
                }
            },
            fr: {
                title: "Nous utilisons des cookies",
                text: "Nous utilisons des cookies et technologies similaires pour améliorer votre expérience et analyser l'utilisation du site. Certains sont essentiels au fonctionnement.",
                privacy: "Lisez notre <a href='{url}' target='_blank'>Politique de Confidentialité</a>",
                buttons: {
                    accept: "Accepter Tout",
                    mandatory: "Accepter Obligatoires",
                    reject: "Rejeter Tout"
                }
            },
            de: {
                title: "Wir verwenden Cookies",
                text: "Wir verwenden Cookies und ähnliche Technologien, um Ihre Erfahrung zu verbessern und die Websitenutzung zu analysieren. Einige sind für die Funktionalität unerlässlich.",
                privacy: "Lesen Sie unsere <a href='{url}' target='_blank'>Datenschutzerklärung</a>",
                buttons: {
                    accept: "Alle Akzeptieren",
                    mandatory: "Notwendige Akzeptieren",
                    reject: "Alle Ablehnen"
                }
            },
            it: {
                title: "Utilizziamo i cookie",
                text: "Utilizziamo cookie e tecnologie simili per migliorare la tua esperienza e analizzare l'utilizzo del sito. Alcuni sono essenziali per la funzionalità.",
                privacy: "Leggi la nostra <a href='{url}' target='_blank'>Informativa sulla Privacy</a>",
                buttons: {
                    accept: "Accetta Tutto",
                    mandatory: "Accetta Necessari",
                    reject: "Rifiuta Tutto"
                }
            }
        };

        function validateUrl(url) {
            try {
                new URL(url);
                return url.startsWith('http://') || url.startsWith('https://');
            } catch {
                return false;
            }
        }

        function updatePreview() {
            const language = document.getElementById('language').value;
            const font = document.getElementById('font').value;
            const textColor = document.getElementById('textColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const privacyUrl = document.getElementById('privacyUrl').value;
            
            const urlInput = document.getElementById('privacyUrl');
            const urlError = document.getElementById('urlError');
            
            // Validate URL
            if (!validateUrl(privacyUrl)) {
                urlInput.classList.add('invalid');
                urlError.style.display = 'block';
                return; // Don't update preview if URL is invalid
            } else {
                urlInput.classList.remove('invalid');
                urlError.style.display = 'none';
            }
            
            const preview = document.getElementById('preview');
            const popupPreview = document.getElementById('popupPreview');
            
            const msg = messages[language];
            const privacyText = msg.privacy.replace('{url}', privacyUrl);
            
            const content = `
                <div class="cookie-banner" style="font-family: ${font}; color: ${textColor}; background-color: ${bgColor};">
                    <h4>${msg.title}</h4>
                    <p>${msg.text}</p>
                    <p>${privacyText}</p>
                    <div class="cookie-buttons">
                        <button class="cookie-btn accept">${msg.buttons.accept}</button>
                        <button class="cookie-btn mandatory">${msg.buttons.mandatory}</button>
                        <button class="cookie-btn reject">${msg.buttons.reject}</button>
                    </div>
                </div>
            `;
            
            preview.innerHTML = content;
            popupPreview.innerHTML = content;
            
            // Add click handlers after content is inserted
            setTimeout(() => {
                addButtonHandlers(preview);
                addButtonHandlers(popupPreview);
            }, 100);
        }

        function addButtonHandlers(container) {
            const buttons = container.querySelectorAll('.cookie-btn');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    handleCookieChoice(this.classList.contains('accept') ? 'accept' : 
                                     this.classList.contains('mandatory') ? 'mandatory' : 'reject');
                });
            });
        }

        function handleCookieChoice(choice) {
            const banner = event.target.closest('.cookie-banner');
            banner.style.opacity = '0.5';
            banner.style.pointerEvents = 'none';
            
            setTimeout(() => {
                banner.style.opacity = '1';
                banner.style.pointerEvents = 'auto';
            }, 1000);
            
            console.log(`Cookie choice: ${choice}`);
        }

        function showPopup() {
            const overlay = document.getElementById('popupOverlay');
            const popup = document.getElementById('popup');
            
            overlay.classList.add('active');
            setTimeout(() => {
                popup.classList.add('active');
            }, 100);
        }

        function hidePopup() {
            const overlay = document.getElementById('popupOverlay');
            const popup = document.getElementById('popup');
            
            popup.classList.remove('active');
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 300);
        }

        async function copyToClipboard() {
            const popupPreview = document.getElementById('popupPreview');
            const copyBtn = document.getElementById('copyBtn');
            
            const htmlContent = popupPreview.innerHTML;
            
            try {
                await navigator.clipboard.writeText(htmlContent);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy HTML';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        // Event listeners
        document.getElementById('language').addEventListener('change', updatePreview);
        document.getElementById('font').addEventListener('change', updatePreview);
        document.getElementById('textColor').addEventListener('change', updatePreview);
        document.getElementById('bgColor').addEventListener('change', updatePreview);
        document.getElementById('privacyUrl').addEventListener('input', updatePreview);

        // Close popup with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hidePopup();
            }
        });

        // Initialize
        updatePreview();
    </script>
</body>
</html>
